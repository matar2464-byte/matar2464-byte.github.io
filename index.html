<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borbi</title>
<meta name="description" content="Borbi : vos prêts entre proches, suivis à deux. Un solde identique sur les deux téléphones, validé par le créancier et le débiteur.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FBF3E8'/%3E%3Cg transform='translate(-1 -1)' fill='none' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M23 18V48' stroke='%235C3A21'/%3E%3Cpath d='M23 18H33A7 7 0 0 1 33 32H23' stroke='%235C3A21'/%3E%3Cpath d='M23 32H35A8 8 0 0 1 35 48H23' stroke='%23C8823C'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg: #F7F1EA; --card: #FFFFFF; --ink: #2A1A10; --muted: #6E5A4B; --brand: #5C3A21; --accent: #C8823C; --border: #EADFD3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E140D; --card: #2A1C12; --ink: #FBF3E8; --muted: #CDB8A5; --brand: #E0A35E; --accent: #E0A35E; --border: #3F2C1E; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; text-align: center; }
  .logo { width: 72px; height: 72px; }
  h1 { margin: 16px 0 6px; font-size: 26px; letter-spacing: -0.4px; }
  .tag { margin: 0 0 20px; color: var(--muted); }
  .msg { background: var(--bg); border-radius: 14px; padding: 14px 16px; margin: 0 0 20px; text-align: left; }
  .msg strong { color: var(--brand); }
  ul { text-align: left; margin: 0 0 4px; padding-left: 20px; color: var(--muted); }
  li { margin: 4px 0; }
  footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#FBF3E8"/><g transform="translate(-1 -1)" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 18V48" stroke="#5C3A21"/><path d="M23 18H33A7 7 0 0 1 33 32H23" stroke="#5C3A21"/><path d="M23 32H35A8 8 0 0 1 35 48H23" stroke="#C8823C"/></g></svg>
  <h1>Borbi</h1>
  <p class="tag">Vos prêts entre proches, suivis à deux.</p>
  <p class="msg">Borbi arrive bientôt sur <strong>Google Play</strong>.</p>
  <ul>
    <li>Un solde identique sur les deux téléphones</li>
    <li>Chaque versement confirmé par le créancier et le débiteur</li>
    <li>Une quittance quand la dette est soldée</li>
  </ul>
  <footer>Sénégal · Gabon · FCFA</footer>
</main>
</body>
</html>
